<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag de imagem</title>
  </head>
  <body>
    <h1>Tag de imagem</h1>

    <!-- img  - imagem -->
    <!-- src  - source (origem)
     alt - alternative -->

    <figure>
      <img
        src="../imagens/Praia.jpg"
        width="500"
        title="imagem de praia com
      coqueiro"
      />
      <figcaption>Imagem de praia</figcaption>
    </figure>
  </body>
</html>
