<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulário HTML</h1>

    <form>
      <label for="nome">Nome:</label>
      <input type="text" name="" id="nome" placeholder="ex: João Silva" />
      <br />
      <br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name=""
        placeholder="exemplo@exemplo.com.br"
      />

      <br />
      <br />
      <label for="semha">Senha:</label>
      <input
        type="password"
        id="senha"
        name=""
        placeholder="Digite sua senha"
      />

      <br />
      <br />
      <label for="">Gênero:</label>
      <input type="radio" name="genero" id="masculino" value="masculino" />
      <label for="masculino">Masculino</label>

      <input type="radio" name="genero" id="feminino" value="feminino" />
      <label for="feminino">Feminino</label>

      <input type="radio" name="genero" id="outros" value="outros" />
      <label for="outros">Outros</label>

      <br />
      <br />

      <span>Estilo Musical</span>
      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalPop"
        value="pop"
      />
      <label for="estiloMusicalPop">Pop</label>

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalRock"
        value="rock"
      />
      <label for="estiloMusicalRock">Rock</label>

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalRap"
        value="rap"
      />
      <label for="estiloMusicalRap">Rap</label>

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalTrap"
        value="trap"
      />
      <label for="estiloMusicalTrap">Trap</label>

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalGospel"
        value="gospel"
      />
      <label for="estiloMusicalGospel">Gospel</label>

      <br />
      <br />

      <label for="descricaoId">Descrição:</label>
      <textarea
        name="descricao"
        id="descricaoId"
        placeholder="Digite uma descrição"
      ></textarea>

      <br />
      <br />

      <label for="estadosId">Selecione um Estado</label>
      <select name="estados" id="estadosId">
        <option value="">Selecione um Estado</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
        <option value="mg">Minas Gerais</option>
        <option value="pr">Paraná</option>
        <option value="mt">Mato Grosso</option>
      </select>

      <br />
      <br />

      <fieldset>
        <legend>Dados pessoais</legend>

        <label for="nomeCompletoId">Nome completo:</label>
        <input type="text" name="nomeCompleto" id="nomeCompletoId" />

        <label for="dataNascimentoId">Data nascimento</label>
        <input type="date" name="dataNascimento" id="dataNascimentoId" />
      </fieldset>

      <br />
      <br />
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
