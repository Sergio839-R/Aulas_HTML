<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
    <script src="https://unpkg.com/@codans/trello"></script>
    <img src="../Formulário_exercício1/img/trello.svg" width="200" />
  </head>
  <body>
    <h1>Fazer login no Trello</h1>
    <form>
      <input type="email" name="" id="email" placeholder="Insira o email" />
      <input type="password" name="" id="senha" placeholder="Insira a senha" />
      <button type="submit">Fazer login</button> <span>ou</span>
      <button type="button">
        <img
          src="../Formulário_exercício1/img/google.svg"
          alt="Google"
          width="20"
        />
        Continuar com o Google
      </button>
      <button type="button">
        <img
          src="../Formulário_exercício1/img/microsoft.svg"
          alt="Microsoft"
          width="20"
        />
        Continuar com o Microsoft
      </button>
      <button type="button">
        <img
          src="../Formulário_exercício1/img/apple.svg"
          alt="Apple"
          width="20"
        />
        Continuar com o Apple
      </button>
      <button type="button">
        <img
          src="../Formulário_exercício1/img/slack.svg"
          alt="Slack"
          width="20"
        />
        Continuar com o Slack
      </button>
    </form>
    <img
      src="../Formulário_exercício1/img/atlassian.svg"
      width="200"
      srcset=""
    />
    <img
      src="../Formulário_exercício1/img/analytics.svg"
      width="200"
      srcset=""
    />
    <img
      src="../Formulário_exercício1/img/interactive.svg"
      width="200"
      srcset=""
    />
  </body>
</html>
